<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Background</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body id="demo">
    <script>
        let i = 0;
        const demo = document.getElementById("demo");

        setInterval(() => {
            i++;
            demo.style.backgroundPositionY = `${i}px`;
        }, 5);
    </script>
</body>
</html>
